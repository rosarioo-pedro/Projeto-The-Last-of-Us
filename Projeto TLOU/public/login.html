<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — The Last of Us</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="header">
        <div class="container">
            <h1 class="titulo">The Last of Us</h1>
            <ul class="navbar">
                <li><a href="index.html">Inicial</a></li>
                <li class="separador">|</li>
                <li class="agora"><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </div>
    </div>

    <div class="cadastro-page">
        <div class="cadastro-overlay"></div>

        <div class="cadastro-card">

            <div class="cadastro-card-header">
                <span class="cadastro-subtitulo">✦ Portão de Entrada ✦</span>
                <h2 class="cadastro-titulo">Inserir <em>Acesso</em></h2>
                <p class="cadastro-sub">Entre para a resistência. Cada sobrevivente conta.</p>
                <div class="cadastro-divisor"></div>
            </div>

            <form class="cadastro-form" onsubmit="return entrar()">

                <div class="form-grupo">
                    <label class="form-label" for="email_input">E-mail</label>
                    <input class="form-input" type="email" id="email_input" name="email" placeholder="seu@email.com"
                        autocomplete="email" />
                </div>
                <div class="form-grupo">
                    <label class="form-label" for="senha_input">Senha</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="senha_input" name="senha" placeholder="••••••••"
                            autocomplete="new-password" />
                        <button type="button" class="toggle-senha" aria-label="Mostrar senha"
                            onclick="toggleSenha('senha_input', this)">
                        </button>
                    </div>
                </div>

                <div class="form-grupo form-check">
                    <label class="check-label">
                        <input type="checkbox" class="check-input" id="termos" name="termos" />
                        <span class="check-box"></span>
                        <span class="check-text">
                            Aceito me manter <a href="#">Conectado!</a>
                        </span>
                    </label>
                </div>

                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro"
                        style="display: none; color: #ff4a4a; text-align: center; margin-bottom: 10px;">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <button type="submit" class="btn-cadastro">
                    <span>Entrar</span>
                </button>

            </form>

            <p class="cadastro-footer-text">
                Não tem uma conta? <a href="cadastro.html">Fazer Cadastro</a>
            </p>

            <div class="cadastro-card-quote">
                <span class="quote-linha"></span>
                <span class="quote-texto">"When you're lost in the darkness, look for the light."</span>
            </div>

        </div>
    </div>
</body>

</html>

<script>
    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/quiz.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
